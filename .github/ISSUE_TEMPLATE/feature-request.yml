
name: Feature Request
description: Propose a new feature or improvement
title: "[FEATURE]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe the problem and proposed solution clearly.

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: Briefly describe the feature you want to introduce.
      placeholder: What feature are you proposing?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem or limitation does this feature address?
      placeholder: |
        Currently, ...
        This makes it difficult to ...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Explain how you think this feature should work.
      placeholder: Describe the expected functionality.
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Describe scenarios where this feature would be useful.
      placeholder: |
        1. When a user ...
        2. They should be able to ...
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Define what must be completed for this feature to be considered done.
      placeholder: |
        - [ ] Requirement 1
        - [ ] Requirement 2
        - [ ] Requirement 3
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Are there other approaches to solving this problem?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add mockups, screenshots, references, or any other relevant information.
    validations:
      required: false
