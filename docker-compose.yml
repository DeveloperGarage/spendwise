services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spendwise
      POSTGRES_PASSWORD: spendwise
      POSTGRES_DB: spendwise
    ports:
      - "5432:5432"
    volumes:
      - spendwise_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendwise -d spendwise"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  spendwise_pg:
